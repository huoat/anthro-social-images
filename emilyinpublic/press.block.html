let lastTrigger;
function node(tag,props={}){const n=document.createElement(tag);for(const [k,v] of Object.entries(props))if(k==='text')n.textContent=v;else if(k==='class')n.className=v;else n.setAttribute(k,v);return n}
function openItem(item,trigger){
 lastTrigger=trigger;content.replaceChildren();dialog.querySelector('#press-viewer-outlet').textContent=item.outlet;
 const viewer=node('div',{class:'press-viewer'});
 if(item.video){const video=node('video',{src:item.video,controls:'',playsinline:'',preload:'metadata',poster:item.image||'', 'aria-label':item.title});viewer.append(video)}

 else if(item.image){viewer.append(node('img',{src:item.image,alt:item.title}))}
 else {const clipping=node('div',{class:'press-clipping'});clipping.append(node('strong',{text:item.outlet}),node('span',{text:item.type}));viewer.append(clipping)}
 const copy=node('div',{class:'press-dialog-copy'});copy.append(node('div',{class:'press-outlet',text:item.outlet+' · '+(item.dateBasis==='Archive upload'?'Archive upload · ':'')+dateFormat.format(new Date(item.date+'T12:00:00Z'))}),node('h2',{id:'press-viewer-title',text:item.title}),node('p',{text:item.description}));

 if(item.credit)copy.append(node('p',{class:'press-attribution',text:'Video and images: '+item.credit}));
